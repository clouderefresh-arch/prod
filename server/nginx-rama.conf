server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 127.0.0.1:443 ssl default_server;
    listen [::1]:443 ssl default_server;
    server_name studio-rama.ru www.studio-rama.ru _;
    root /var/www/rama;
    index rama.html index.html;

    ssl_certificate /etc/rama/tls/fullchain.pem;
    ssl_certificate_key /etc/rama/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2048m;

    location / {
        try_files $uri $uri/ /rama.html;
    }

    location /upload/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2048m;
    }
}
